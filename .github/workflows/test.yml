name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pg-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - id: v
        run: |
          versions=$(curl -fsSL https://www.postgresql.org/versions.json | jq -c '[.[] | select(.supported) | .major] | sort_by(tonumber) | .[-3:] | reverse')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    needs: pg-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJson(needs.pg-versions.outputs.versions) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rocketclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rocketclaw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ROCKETCLAW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rocketclaw_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install cloc, jq, and ripgrep
        run: sudo apt-get update && sudo apt-get install -y cloc jq ripgrep
      - name: Install Playwright and Chromium for browser tests
        run: |
          dir="$RUNNER_TEMP/playwright"
          mkdir -p "$dir"
          cd "$dir"
          bun add playwright-core@1.63.0
          ./node_modules/.bin/playwright-core install --with-deps chromium
          echo "ROCKETCLAW_PLAYWRIGHT_MODULE=$dir/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "ROCKETCLAW_CHROMIUM=$(bun -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - run: make test
      - name: Web tests against Go test servers
        run: |
          dir="$RUNNER_TEMP/web-test-servers"
          mkdir -p "$dir"
          go test -c -o "$dir/rpc.test" ./internal/rocketclaw/frontend/rpc
          (cd internal/rocketclaw/frontend/rpc && ROCKETCLAW_WEB_TEST_SERVER_DIR="$dir" exec "$dir/rpc.test" -test.v -test.timeout 30m -test.run '^(TestPublicProgressRealBrowser|TestSessionEntries|TestSidebarHTTPStreamsBeforeGoTailAndCancels)$') > "$dir/servers.log" 2>&1 &
          servers=$!
          until [ "$(ls "$dir"/*.env 2>/dev/null | wc -l)" -eq 3 ]; do
            kill -0 "$servers" 2>/dev/null || { cat "$dir/servers.log"; exit 1; }
            sleep 1
          done
          set -a
          for f in "$dir"/*.env; do . "$f"; done
          set +a
          web=0
          make -C internal/rocketclaw/web test || web=$?
          kill -INT "$servers"
          go=0
          wait "$servers" || go=$?
          cat "$dir/servers.log"
          [ "$web" -eq 0 ] && [ "$go" -eq 0 ]
