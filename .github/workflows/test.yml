name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pg-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.v.outputs.versions }}
    steps:
      - id: v
        run: |
          versions=$(curl -fsSL https://www.postgresql.org/versions.json | jq -c '[.[] | select(.supported) | .major] | sort_by(tonumber) | .[-3:] | reverse')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    needs: pg-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJson(needs.pg-versions.outputs.versions) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rocketclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rocketclaw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ROCKETCLAW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rocketclaw_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install cloc, jq, ripgrep, and protoc
        run: sudo apt-get update && sudo apt-get install -y cloc jq ripgrep protobuf-compiler
      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install web dependencies
        run: cd web && bun install
      - run: make test
