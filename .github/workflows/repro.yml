name: repro

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [all-files-two-at-once, spaces-alone, spaces-beside-session-list]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v6
        with:
          path: internal/rocketclaw/web/node_modules
          key: node-modules-${{ hashFiles('internal/rocketclaw/web/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: internal/rocketclaw/web
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-core
          key: playwright-1.63.0-no-shell
      - name: Install Playwright and Chromium for browser tests
        run: |
          dir="$HOME/.cache/playwright-core"
          [ -d "$dir/node_modules/playwright-core" ] || (mkdir -p "$dir" && cd "$dir" && bun add playwright-core@1.63.0)
          cd "$dir"
          ./node_modules/.bin/playwright-core install --no-shell chromium
          echo "ROCKETCLAW_PLAYWRIGHT_MODULE=$dir/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "ROCKETCLAW_CHROMIUM=$(bun -e 'console.log(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Run
        working-directory: internal/rocketclaw/web
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/logs"
          case "${{ matrix.mode }}" in
            all-files-two-at-once)
              find src -type f \( -name "*.test.ts" -o -name "*.test.tsx" \) ! -name "*-transport.test.ts" |
                awk 'NR == FNR { seconds[$2] = $1; next } { w = $0 in seconds ? seconds[$0] : 1; print w, $0 }' ../../../.github/web-test-seconds.tsv - |
                sort -k1,1nr -k2,2 | awk '{ print $2 }' > "$RUNNER_TEMP/files" ;;
            spaces-alone) printf 'src/spaces.browser.test.ts\n%.0s' 1 2 3 > "$RUNNER_TEMP/files" ;;
            spaces-beside-session-list) printf '%s\n' src/spaces.browser.test.ts src/session-list.browser.test.ts > "$RUNNER_TEMP/files" ;;
          esac
          n=0
          while read -r f; do n=$((n + 1)); printf '%s %s\n' "$n" "$f"; done < "$RUNNER_TEMP/files" |
            xargs -P 2 -L 1 sh -c 'bun test "$1" > "$RUNNER_TEMP/logs/$0-$(basename "$1").log" 2>&1; echo "$0 $1 rc=$?"'
          for log in "$RUNNER_TEMP"/logs/*spaces*.log; do
            echo "===== $log"
            grep -E '^\(fail\)|^ *[0-9]+ (pass|fail)' "$log"
            awk '/with other RocketClaws the strip lists/ { found = 1 } found' "$log" | head -150
          done
