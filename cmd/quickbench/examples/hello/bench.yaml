name: hello
description: minimal BAR sample
tags:
  - sample
root: main
# Subject matrix: each row × each variation. Omit matrix for one "default" cell
# that keeps agents/*.md models as written.
matrix:
  - id: default
  - id: mini-root
    agents:
      main:
        model: gpt-5.4-mini
  - id: warmer-prompt
    agents:
      main:
        system: |
          Greet the user warmly in one short sentence. Be friendly.
  - id: mini-and-warmer
    agents:
      main:
        model: gpt-5.4-mini
        system: |
          Greet the user warmly in one short sentence. Be friendly.
elo:
  model: gpt-5.6-luna
  reasoningEffort: max
  criteria: |
    Prefer a warm, natural greeting in one short sentence. Penalize verbosity and refusal.
