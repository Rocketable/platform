# Generate with: go generate ./cmd/rocketclaw
all: false
dir: '{{.InterfaceDir}}'
filename: '{{.InterfaceName | lower}}_mocks_test.go'
force-file-write: true
formatter: goimports
pkgname: '{{.SrcPackageName}}'
recursive: false
template: matryer
inpackage: true
packages:
  github.com/Rocketable/platform/cmd/rocketclaw:
    interfaces:
      mcpRelay:
        config:
          structname: mcpRelayMock
  github.com/Rocketable/platform/internal/rocketclaw/backend:
    interfaces:
      FrontendAssembler:
        configs:
          - structname: frontendAssemblerMock
          - dir: '{{.ConfigDir}}/internal/rocketclaw/frontend/rpc'
            pkgname: rpc
            structname: mockFrontendAssembler
            inpackage: false
      SlackFrontend:
        configs:
          - structname: slackFrontendMock
          - dir: '{{.ConfigDir}}/cmd/rocketclaw'
            pkgname: main
            structname: SlackFrontendMock
            inpackage: false
      backgroundNotes:
        config:
          structname: backgroundNotesMock
      directBridge:
        config:
          structname: directBridgeMock
      runLockWork:
        config:
          structname: runLockWorkMock
  github.com/Rocketable/platform/internal/rocketclaw/frontend:
    interfaces:
      Backend:
        configs:
          - dir: '{{.ConfigDir}}/internal/rocketclaw/frontend/slack'
            pkgname: slackconnector
            structname: backendMock
            inpackage: false
          - dir: '{{.ConfigDir}}/internal/rocketclaw/frontend/rpc'
            pkgname: rpc
            structname: mockBackend
            inpackage: false
          - dir: '{{.ConfigDir}}/cmd/rocketclaw'
            pkgname: main
            structname: BackendMock
            inpackage: false
  github.com/Rocketable/platform/internal/rocketclaw/frontend/cron:
    interfaces:
      Runner:
        configs:
          - structname: runnerMock
          - dir: '{{.ConfigDir}}/internal/rocketclaw/frontend/rpc'
            pkgname: rpc
            structname: mockCronRunner
            inpackage: false
  github.com/Rocketable/platform/internal/rocketclaw/frontend/rpc:
    interfaces:
      ChannelAgentChoices:
        configs:
          - structname: mockChannels
          - dir: '{{.ConfigDir}}/cmd/rocketclaw'
            pkgname: main
            structname: mockWebChannels
            inpackage: false
      CronJobs:
        configs:
          - structname: mockCronJobs
          - dir: '{{.ConfigDir}}/cmd/rocketclaw'
            pkgname: main
            structname: mockWebCron
            inpackage: false
  github.com/Rocketable/platform/internal/rocketclaw/frontend/slack:
    interfaces:
      channelFactsStore:
        config:
          structname: channelFactsStoreMock
  github.com/Rocketable/platform/internal/rocketclaw/protocol:
    interfaces:
      OutboundPublisher:
        config:
          dir: '{{.ConfigDir}}/internal/rocketclaw/backend'
          pkgname: backend
          structname: outboundPublisherMock
          inpackage: false
      PrimaryTextRouter:
        config:
          dir: '{{.ConfigDir}}/internal/rocketclaw/frontend/slack'
          pkgname: slackconnector
          structname: primaryTextRouterMock
          inpackage: false
      UserQuestionAsker:
        config:
          dir: '{{.ConfigDir}}/internal/rocketclaw/backend'
          pkgname: backend
          structname: userQuestionAskerMock
          inpackage: false
  github.com/Rocketable/platform/internal/rocketclaw/workflow:
    interfaces:
      AgentRunner:
        config:
          filename: agentrunner_mocks_test.go
          structname: agentRunnerMock
  github.com/Rocketable/platform/internal/rocketcode:
    interfaces:
      BackgroundJobs:
        config:
          structname: mockBackgroundJobs
      BackgroundWork:
        config:
          dir: '{{.ConfigDir}}/internal/rocketclaw/backend'
          pkgname: backend
          structname: backgroundWorkMock
          inpackage: false
      Journal:
        config:
          structname: mockJournal
      ChildSessions:
        config:
          structname: mockChildSessions
      permissionReviewer:
        config:
          structname: mockPermissionReviewer
      responsesAPI:
        config:
          structname: mockResponsesAPI
  google.golang.org/grpc:
    interfaces:
      ServerStream:
        config:
          dir: '{{.ConfigDir}}/internal/rocketclaw/frontend/rpc'
          pkgname: rpc
          structname: mockServerStream
          inpackage: false
