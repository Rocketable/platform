version: "2"

linters:
  default: standard
  enable:
    - asciicheck
    - bodyclose
    - canonicalheader
    - depguard
    - dogsled
    - dupl
    - dupword
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - exhaustive
    - exptostd
    - funcorder
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - govet
    - ineffassign
    - intrange
    - iotamixing
    - ireturn
    - misspell
    - modernize
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  exclusions:
    paths:
      - third_party/.*
      - .*_gen\..*
    rules:
      - path: _test\.go
        linters:
          - dupword
          - gocyclo
  settings:
    dupword:
      skip-raw-strings: true
    depguard:
      rules:
        main:
          deny:
            - pkg: "reflect$"
              desc: avoid reflection in project code
            - pkg: "sync/atomic$"
              desc: use higher-level synchronization primitives instead of sync/atomic
            - pkg: "unsafe$"
              desc: avoid unsafe in project code
        shell-expand:
          files:
            - $all
            - "!$test"
            - "!**/internal/rocketclaw/harness/permission.go"
            - "!**/internal/rocketclaw/harness/public_progress.go"
            - "!**/internal/rocketclaw/harness/shell.go"
          deny:
            - pkg: "mvdan.cc/sh/v3/expand$"
              desc: expand panics on dynamic shell words; expand only words quotedLiteralWord accepts (docs/solutions/runtime-errors/mvdan-expand-panicked-on-dynamic-shell-words.md)
    gocritic:
      enable-all: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - github.com/Rocketable/platform/internal/rocketclaw/backend.directBridge
        - go.starlark.net/starlark.Value
        - go.starlark.net/starlark.Iterator
    godox:
      keywords:
        - TODO
        - BUG
        - FIXME
        - NOTE
        - OPTIMIZE
        - GPT
    revive:
      enable-default-rules: true
      rules:
        - name: blank-imports
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
