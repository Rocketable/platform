syntax = "proto3";

package rpc;

option go_package = "github.com/Rocketable/platform/internal/rocketclaw/frontend/rpc";

message ListSessionsRequest {
  // The location of the caller's active tab while its window has focus, else empty.
  string viewing = 1;
  // The version of the last complete listing the caller holds. When the server still knows it, the
  // listing sends only the rows that changed since; otherwise it sends every row.
  string since = 2;
  // The caller marked the viewing tab unread while it was in view: the view counts without clearing the mark.
  bool hold = 3;
  // Set by the server for a poll from a page it serves or trusts: only such a poll records the view and wakes the
  // caller's timers that came due.
  bool same_origin = 4;
}

message Session {
  string id = 1;
  string title = 2;
  string preview = 3;
  string updated_at = 4;
  string agent = 5;
  reserved 6;
  reserved 7;
  reserved "allowed_agents";
  bool running = 8;
  bool pinned = 9;
  string name = 10;
  reserved 11;
  reserved 12;
  string forked_from = 13;
  repeated string tags = 14;
  // The chat's recorded origin is a cron run, even after human follow-ups.
  bool cron = 15;
  string cron_name = 16;
  // A remote OpenCode session names its configured server and folder; offline while it is unreachable.
  string server = 17;
  string directory = 18;
  bool offline = 19;
  // The Web space the session was born in, empty for none.
  string space_id = 20;
  // A remote OpenCode session's newest assistant text, read when its last seen turn ended.
  string reply = 21;
  // Work that can wake the session after its turn runs: a running Background Job, or a remote
  // OpenCode session's running child session or shell command.
  bool background = 22;
  // A remote OpenCode session's selected model, "<provider>/<model>"; agent is its selected agent.
  string model = 23;
  ConversationKind kind = 24;
  // A remote OpenCode session's own ID on its server.
  string remote_session_id = 25;
  // What the session is called when it has no name or preview.
  string label = 26;
  // When something new started waiting for the caller, RFC3339Nano; empty once read.
  string unread_at = 27;
  // The session waits on a person: a running turn's unanswered question, or a remote OpenCode
  // session's pending form or permission request, its own or a child session's.
  bool asking = 28;
  // What the session's work waits on, its runs reporting to it included, and since when, RFC3339Nano.
  WorkState work_state = 29;
  string state_since = 30;
  // The session is bound to External MCP, or a run reporting to it is.
  bool external = 31;
  // When its newest running or waiting turn was created, else its last update, RFC3339Nano.
  string arrived_at = 32;
  // The caller's mark raises no notification: they set it themselves, or it was written while the tab was parked
  // or was there when they parked it.
  bool marked_unread = 33;
  // The caller parked its tab.
  bool parked = 34;
  // When its park ends, RFC3339Nano; empty for none.
  string until = 35;
  // With a mark, the notification text a timer wrote: "Park ended"; else empty.
  string note = 36;
  // The caller parked its tab until its next turn ends, which has no time.
  bool until_done = 37;
  // A prompt the caller sends parks its tab until it is done: by their choice for the session, else for every session.
  bool auto_park = 38;
}

// TabAttention is the caller's attention on a tab location that is not a session, as a Session row carries a
// session's. A row with only its path says the location no longer has one.
message TabAttention {
  string path = 1;
  string unread_at = 2;
  bool quiet = 3;
  bool parked = 4;
  string until = 5;
  // With a mark, the notification text the server wrote.
  string note = 6;
}

// The first of these a session has: asking, running work, queued turns.
enum WorkState {
  IDLE = 0;
  NEEDS_YOU = 1;
  RUNNING = 2;
  QUEUED = 3;
}

// What a conversation is, as RocketClaw records it when it creates the conversation.
enum ConversationKind {
  WEB_CHAT = 0;
  SLACK_THREAD = 1;
  CRON_RUN = 2;
  ONE_OFF_CRON_RUN = 3;
  EXTERNAL_MCP_RUN = 4;
  SUBAGENT = 5;
  REVIEW = 6;
  SHADOW = 7;
  REMOTE_OPENCODE = 8;
}

message HistoryRequest {
  string id = 1;
  string source_conversation_id = 2;
  reserved 3;
  // Opaque inventory returned by the last applied History response.
  string revision = 4;
  // Positive limit returns only the newest limit saved entries plus running
  // turns, and follows only those entries in revision.
  int32 limit = 5;
  // Positive before reads a settled page of entries older than this saved-entry
  // ID: the newest limit of them, or all from saved-entry ID from onward.
  int64 before = 6;
  int64 from = 7;
}

message HistoryResponse {
  repeated TranscriptEvent messages = 1;
  // JSON object describing the chat's origin. Empty means no origin.
  string origin = 2;
  repeated string delegations = 3;
  string revision = 10;
  bool reset = 4;
  repeated string replaced_keys = 5;
  repeated string removed_keys = 6;
  repeated string entry_keys = 7;
  bool running = 8;
  string terminal = 9;
  // Saved-entry ID where these entries begin; zero means the beginning.
  int64 start = 11;
  // Older saved entries exist before start.
  bool more = 12;
  bool revert_eligible = 13;
  string revert_message_id = 14;
  bool can_undo = 15;
  // Message ID of the newest message undo must keep: one from a cron run, External MCP, or Slack.
  // Empty when undo may reach the first message.
  string revert_floor = 21;
  // An allowed agent's execute or task call runs attached, so MoveToBackground has work to move.
  bool movable = 16;
  // Background Jobs running or holding an undelivered Completion Note, including those of hidden
  // cron and External MCP runs whose destination is this conversation.
  repeated BackgroundJob background_jobs = 17;
  // Unanswered ask_user_question calls of this conversation's Web turns, in question ID order.
  repeated PendingQuestion pending_questions = 18;
  // Page-scoped turn correlations, including shadows without transcript output.
  repeated ShadowBinding shadows = 19;
  map<string, string> review_rationales = 20;
  // The conversations this one nests under, from its top-level conversation down, then itself.
  repeated LineageLevel lineage = 22;
}

message LineageLevel {
  string id = 1;
  ConversationKind kind = 2;
  string agent = 3;
}

message ShadowBinding {
  string parent_conversation_id = 1;
  string parent_agent = 2;
  string shadow_agent = 3;
  string child_conversation_id = 4;
  repeated ShadowTurn turns = 5;
}

message ShadowTurn {
  string parent_source_conversation_id = 1;
  string parent_turn_id = 2;
  string child_turn_id = 3;
  int64 order = 4;
  bool running = 5;
  // Same terminal values as HistoryResponse; empty child ID and terminal means waiting.
  string terminal = 6;
  // Changes on child transcript updates, even when the parent transcript does not.
  string revision = 7;
}

// An ask_user_question call a Web turn waits on; AnswerQuestion answers it by ID.
message PendingQuestion {
  string id = 1;
  string question = 2;
  string details = 3;
  repeated QuestionOption options = 4;
  // Several options may be selected.
  bool multiple = 5;
}

message QuestionOption {
  string label = 1;
  string value = 2;
  string description = 3;
}

// A listed Background Job, or the job a Completion Note reports.
message BackgroundJob {
  string job_id = 1;
  // execute or task.
  string kind = 2;
  // running, completed, failed, stopped, or killed.
  string state = 3;
  string label = 4;
  string tool_call_id = 5;
  // Child-session key of the subagent a task job runs.
  string subagent_key = 6;
  // user or agent, for a stopped job.
  string stopped_by = 7;
  // The job of a hidden run whose destination is this conversation; its transcript is not here.
  bool hidden = 8;
  // The job's Completion Note text, in TranscriptEvent.completion_notes only.
  string note = 9;
}

message StageRevertRequest { string id = 1; string message_id = 2; }
message StageRevertResponse { string revert_message_id = 1; TranscriptEvent prompt = 2; }
message ClearRevertRequest { string id = 1; }
message ClearRevertResponse {}

// A listing streams its first message, then one message per sent row, then the completion.
message ListSessionsResponse {
  repeated Session sessions = 1;
  // The first message carries the owner, the remote servers, and per agent the tags people may set
  // on its sessions, so a page need not wait for the rows. Remote OpenCode sessions take any tag.
  string owner = 2;
  bool upstream_success = 3; // Marks the completion message.
  reserved 4, 8;
  map<string, string> opencode_servers = 5; // Server name to its origin, for links to its sessions.
  map<string, TagChoices> agent_tags = 6;
  // The completion carries this listing's version, for the next request's since. When since names a
  // listing the server still holds, it is echoed: only rows changed since were sent, and removed names
  // the sessions gone since. Otherwise since is empty and every row was sent.
  string version = 7;
  repeated string removed = 9;
  string since = 10;
  // The completion carries the caller's attention rows of tab locations that are not sessions, those changed since
  // since, or every one.
  repeated TabAttention tabs = 11;
  // The first message carries the caller's tab-state revision, which a timer that brings a closed tab back raises.
  int64 tab_revision = 12;
}

message TagChoices {
  repeated string tags = 1;
}

message CreateSessionRequest {
  string name = 1;
  string agent = 2;
  string source_conversation_id = 3;
  // Set together to create a remote OpenCode session in that folder.
  string opencode_server = 4;
  string directory = 5;
  // The Web space the person is in; a session whose agent names no space is born there.
  string space_id = 6;
}

message CreateSessionResponse {
  string id = 1;
  // Set when the agent is sticky and id is its existing session, resumed instead of created.
  bool resumed = 2;
}

message ForkSessionRequest {
  string id = 1;
  string before = 2;
}

message ForkSessionResponse {
  string id = 1;
  TranscriptEvent prompt = 2;
}

message SearchMessagesRequest { string query = 1; }
message MessageMatch {
  string conversation_id = 1;
  TranscriptEvent message = 2;
}
message SearchMessagesResponse {
  repeated MessageMatch matches = 1;
  repeated string tag_ids = 2;
  reserved 3;
}
// filters applies only the filters, leaving free text to the caller, and wins over messages.
// A Search page names its tab and search_id, and its search runs on the server past the request:
// the same query joins that run or takes its finished answer, once; another query replaces it.
// entered says the person entered the query, so the run marks the tab when it finishes. fresh says
// the caller's session list changed since it last asked: the same query starts over, and a run still
// going that the person entered hands that on.
message SearchSessionsRequest {
  string query = 1;
  bool messages = 2;
  bool filters = 3;
  string tab = 4;
  string search_id = 5;
  bool entered = 6;
  bool fresh = 7;
}
// A filter term; start and end are UTF-16 code-unit offsets in the submitted query.
message SearchTerm {
  string key = 1;
  string text = 2;
  int32 start = 3;
  int32 end = 4;
}
// A found chat and the field (Name, Room, Agent, Session, Origin or Preview)
// whose text holds the needle; an empty field means only message text did.
message SessionMatch {
  string conversation_id = 1;
  string field = 2;
  string text = 3;
}
message SearchSessionsResponse {
  repeated SearchTerm terms = 1;
  // The query without its terms; needle is text lowercased.
  string text = 2;
  string needle = 3;
  repeated SessionMatch matches = 4;
  repeated MessageMatch messages = 5;
  repeated string mention_ids = 6;
  reserved 7, 8;
  repeated string principals = 9;
}

// BoardRequest asks for the lanes of the Dashboards open in a space; each lane is a session search
// query whose free text matches session fields only.
message BoardRequest {
  string space_id = 1;
  repeated BoardDashboard dashboards = 2;
}
message BoardDashboard { repeated string lanes = 1; }
// BoardResponse holds the requested Dashboards' lanes in request order. A session is in its
// Dashboard's first lane it matches; a lane lists at most 200 of its sessions, newest arrival
// first, as ListSessions would list them, and total counts them all.
message BoardResponse { repeated BoardLanes dashboards = 1; }
message BoardLanes { repeated BoardLane lanes = 1; }
message BoardLane {
  repeated Session sessions = 1;
  int32 total = 2;
}

// SlackNamesRequest asks for display names of Slack IDs.
message SlackNamesRequest {
  repeated string ids = 1;
}

// SlackNamesResponse maps IDs to bare display strings without a leading @ or #.
// The web prepends those sigils. Unresolved IDs are omitted.
message SlackNamesResponse {
  map<string, string> names = 1;
}
message HandoffRequest { string id = 1; }
message HandoffResponse { string document = 1; }

message JoinRequest {
  string id = 1;
}

// Wake-up hints only. History returns the revision actually read.
message ConversationChange {
  string conversation_id = 1;
  string revision = 2;
}

message TranscriptEvent {
  string text = 1;
  reserved 2;
  string role = 3;
  bool complete = 4;
  string turn_id = 5;
  string tool_call_id = 6;
  string tool_name = 7;
  repeated Attachment attachments = 8;
  string message_id = 9;
  string agent = 10;
  string model = 11;
  optional string reasoning_effort = 12;
  string origin = 13;
  string header = 14;
  string entry_key = 15;
  string item_id = 16;
  string input_id = 17;
  // Fixed public lifecycle label; independent of the parent turn's running state.
  string state = 18;
  string parent_id = 19;
  string principal = 20;
  // Completion Notes this system input delivers, in order, from their stored jobs.
  repeated BackgroundJob completion_notes = 21;
  // Delegation History a task call's row opens: the subagent it started or continued.
  string delegation = 22;
  // Delegation History a reviewed call's row opens: its automatic permission review.
  string review = 23;
  // On an Execute call's first event: the calls its script made, in start order. Chats saved
  // before calls were recorded list only the calls the automatic approver checked.
  repeated CodeModeCall code_mode_calls = 24;
  // On an Execute call's first event: the automatic approver's reason for its whole script.
  string script_reason = 25;
  // Turn under which review saves the approver's answer on this call itself, such as on an
  // Execute call's whole script. Reviews saved before turns were named have another turn.
  string review_turn = 26;
  // The automatic approver's outcome (allow or deny) for script_reason.
  string script_outcome = 27;
}

// One call an Execute script made. Arguments are clipped to 4 KiB. Status is running, ok, error,
// or denied, and empty when read from an older chat's review. Outcome (allow or deny), reason, and
// review_turn, the turn under which the script's review saves the approver's answer on this call,
// are set only when the automatic approver ran.
message CodeModeCall {
  string name = 1;
  string arguments = 2;
  reserved 3;
  string status = 4;
  string outcome = 5;
  string reason = 6;
  string review_turn = 7;
}

// Attachment download frames carry at most 256 KiB. History carries metadata only.
message Attachment {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
  bool original_unverified = 5;
  bytes data = 6;
  string conversation_id = 7;
}

enum PromptDelivery {
  STEER = 0;
  QUEUE = 1;
  STASH = 2;
}

message PromptRequest {
  string id = 1;
  string text = 2;
  PromptDelivery delivery = 3;
  repeated string attachment_ids = 4;
  string message_id = 5;
}

message PromptResponse {
  string private_text = 1;
}

message CronJob {
  string stem = 1;
  string status = 2;
  string last_run = 3;
  string next_run = 4;
  string schedule = 5;
  string body = 6;
  string agent = 7;
  reserved 8;
  repeated string upcoming = 9;
  string origin = 10;
  // The job's space, else its agent's; empty shows the job in every space.
  string space = 11;
}

message Agent {
  string name = 1;
  string model = 2;
  string reasoning = 3;
  string description = 4;
  string verbosity = 5;
  string prompt = 6;
  string permissions = 7;
  string origin = 8;
  string custom_shell = 9;
  // Voices offered by the default openai provider, the default first; empty when unavailable.
  repeated string voices = 10;
  // New sessions in another space do not offer this agent; empty offers it in every space.
  string space = 11;
  // user or global for an agent with one Web session per person or one in all; empty when off.
  string sticky = 12;
  // A sticky agent's existing session, the caller's own for user, that a new session resumes; empty when none.
  string sticky_session = 13;
}

message ListAgentsRequest { string conversation_id = 1; }

message ListAgentsResponse {
  repeated Agent agents = 1;
  string current_agent = 2;
}

message Skill {
  string name = 1;
  string description = 2;
  string license = 3;
  string compatibility = 4;
  string content = 5;
  string origin = 6;
}

message ListSkillsRequest { string agent = 1; }

message ListSkillsResponse {
  repeated Skill skills = 1;
}

message Workflow {
  string name = 1;
  string description = 2;
}

message ListWorkflowsRequest {}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
}

message ListCronJobsRequest {}

message ListCronJobsResponse {
  repeated CronJob jobs = 1;
}

// PageRequest names an agent's Hosted Page file, or its Page Data entry when data is set.
// An empty path or one ending in / names index.html.
message PageRequest {
  string agent = 1;
  string path = 2;
  bool data = 3;
}

// Page is a stored file or Page Data entry with its agent's current space.
message Page {
  string space = 1;
  string content_type = 2;
  bytes body = 3;
}

message ListPagesRequest {}

// ListPagesResponse lists the HTML files of agents that still exist.
message ListPagesResponse {
  repeated PageEntry pages = 1;
}

message PageEntry {
  string agent = 1;
  string space = 2;
  string path = 3;
}

message RunCronJobRequest {
  string stem = 1;
}

message RunCronJobResponse {
  string id = 1;
}

message AnswerQuestionRequest {
  string conversation_id = 1;
  // The PendingQuestion ID.
  string ask_id = 2;
  // Values of the chosen options.
  repeated string selected = 3;
  string custom = 4;
}

message AnswerQuestionResponse {}

message ConfigChannel {
  string channel = 1;
  repeated string agents = 2;
}

message ConfigView {
  string workspace = 1;
  repeated string overlays = 2;
  reserved 3;
  repeated ConfigChannel slack_channels = 4;
  repeated string mcp_servers = 5;
  string logging_level = 6;
  string auto_approver_model = 7;
  bool instrumentation_enabled = 8;
  bool mcp_external = 9;
  reserved 10;
  string tailscale_user = 11;
  // Configured provider names, the openai provider always included; the server never lists models.
  repeated string providers = 12;
}

message ListConfigRequest {}

message ListConfigResponse {
  ConfigView config = 1;
}

// TestModelRequest names the model to try, as "provider/model#effort".
message TestModelRequest { string model = 1; }

// TestModelResponse holds the provider's error text, empty when the model works, and how long the
// request took.
message TestModelResponse {
  string error = 1;
  int64 elapsed_ms = 2;
}

// AgentDraft is an agent being written in the agent editor. Its first variant is the agent itself and the
// others its comparison shadows; all share mode, easy or advanced. save_state is editing, saving, waiting
// (for a merge) or live; existing says a save destination already holds an agent of this name; pending is
// the draft's last save to a Git overlay, kept after it stops waiting so the page can show its pull request.
message AgentDraft {
  string id = 1;
  int64 revision = 2;
  string name = 3;
  string mode = 4;
  repeated AgentDraftVariant variants = 5;
  AgentDraftExternalMCP external_mcp = 6;
  string test_chat = 7;
  string save_state = 8;
  bool existing = 9;
  AgentDraftPending pending = 10;
}

// AgentDraftPending is a save pushed to the Git overlay destination: commit on branch, which is base, the
// branch the overlay pins, or a branch of the save's own for a pull request into base. number is the pull
// request gh opened, and link its page or, without gh, a GitHub page that compares branch with base.
message AgentDraftPending {
  string destination = 1;
  string base = 2;
  string branch = 3;
  string commit = 4;
  int32 number = 5;
  string link = 6;
}

// AgentDraftVariant is one version of the draft's agent file: its settings other than mode, and its
// instructions.
message AgentDraftVariant {
  string name = 1;
  repeated AgentDraftSetting settings = 2;
  string body = 3;
}

// AgentDraftSetting is one top-level setting of an agent file; value is its YAML.
message AgentDraftSetting {
  string key = 1;
  string value = 2;
}

// AgentDraftExternalMCP is how the draft's test chat poses as an External MCP call.
message AgentDraftExternalMCP {
  bool on = 1;
  string caller = 2;
  map<string, string> metadata = 3;
}

// AgentDraftSplice removes remove code points of the instructions at at, then inserts insert there.
message AgentDraftSplice {
  int32 at = 1;
  int32 remove = 2;
  string insert = 3;
}

// AgentDraftOp is one change to a draft, made on base_revision. op_id is the client's id and a sequence
// number, so a client recognizes its own change among the committed ones. kind is set_field, edit_body,
// add_variant, rename_variant, remove_variant, set_mode, set_external_mcp, set_test_chat, set_save_state,
// rename, or, as requests the server commits as those kinds, edit_file and restore. value is a setting's
// YAML (empty removes it), a variant's new name, the variant a new one copies, the mode, test chat, save
// state or agent name, or an edit_file's whole file. from is the revision a restore brings back. revision,
// at (RFC 3339) and author are the server's, set when the change committed.
message AgentDraftOp {
  int64 revision = 1;
  string at = 2;
  int64 base_revision = 3;
  string op_id = 4;
  string author = 5;
  string kind = 6;
  string variant = 7;
  string key = 8;
  string value = 9;
  repeated AgentDraftSplice splices = 10;
  AgentDraftExternalMCP external_mcp = 11;
  int64 from = 12;
}

// AgentDraftPresence is where an open editor is in a draft: its variant, and its place, a setting key or
// an offset in the instructions. username is the server's.
message AgentDraftPresence {
  string client = 1;
  string username = 2;
  string variant = 3;
  string place = 4;
}

// CreateAgentDraftRequest starts a draft named name: blank in mode, from the starter agent template, or,
// with copy, as a copy of the effective agent name.
message CreateAgentDraftRequest {
  string name = 1;
  string mode = 2;
  string template = 3;
  bool copy = 4;
}

message ListAgentDraftsRequest {}

// ListAgentDraftsResponse is every draft, newest first, and the starter agents a draft can begin from.
message ListAgentDraftsResponse {
  repeated AgentDraft drafts = 1;
  repeated string templates = 2;
}

// GetAgentDraftRequest reads draft id and the changes committed after revision since.
message GetAgentDraftRequest {
  string id = 1;
  int64 since = 2;
}

// GetAgentDraftResponse is the draft now, the changes after since in order, and the editors seen in the
// last 30 seconds.
message GetAgentDraftResponse {
  AgentDraft draft = 1;
  repeated AgentDraftOp ops = 2;
  repeated AgentDraftPresence presence = 3;
}

// ApplyAgentDraftOpRequest commits op to draft id. cursor is the caller's place in the variant's
// instructions on op's base revision, before op.
message ApplyAgentDraftOpRequest {
  string id = 1;
  AgentDraftOp op = 2;
  int32 cursor = 3;
}

// ApplyAgentDraftOpResponse is the draft's new revision and the cursor moved past every change committed
// through it, op included. invalid_line, when set, is the line of the file or setting YAML that is not
// valid yet: nothing was stored.
message ApplyAgentDraftOpResponse {
  int64 revision = 1;
  int32 cursor = 2;
  int32 invalid_line = 3;
}

// SetAgentDraftPresenceRequest records where the caller's editor is in draft id.
message SetAgentDraftPresenceRequest {
  string id = 1;
  AgentDraftPresence presence = 2;
}

message SetAgentDraftPresenceResponse {}

// AgentSettingsRequest asks for the setting help of mode, easy or advanced.
message AgentSettingsRequest { string mode = 1; }

// AgentSettingsResponse is the help for every setting mode allows, in agent-file order.
message AgentSettingsResponse { repeated AgentSettingHelp settings = 1; }

// AgentSettingHelp explains one agent file setting for someone who is not an engineer. key joins nested
// keys with dots; default_text says what leaving it out does, allowed which values load; control is text,
// switch, choice, list, model or file.
message AgentSettingHelp {
  string key = 1;
  string group = 2;
  string label = 3;
  string explanation = 4;
  string default_text = 5;
  string allowed = 6;
  string control = 7;
  repeated string choices = 8;
  bool required = 9;
  bool common = 10;
}

// DraftPromptRequest sends text to draft id's test chat, as a Web message or, while the draft is in External
// MCP mode, as an External MCP call with the draft's pairs and caller. The server reads the draft, the mode
// and the live agent's file when it takes the message, and every column answers from what it read.
message DraftPromptRequest {
  string id = 1;
  string text = 2;
}

// RestartDraftChatRequest gives draft id a new, empty test chat, then sends it replay's texts, in order, with
// one read of the draft. The old chat keeps its messages and the answers still running in it.
message RestartDraftChatRequest {
  string id = 1;
  repeated string replay = 2;
}

// AgentDraftProblem is a setting of a draft's variant, or with an empty variant of the live agent's file,
// that keeps it from running, with the setting help's sentence for what it allows or the reason in plain words.
message AgentDraftProblem {
  string variant = 1;
  string key = 2;
  string sentence = 3;
}

// DraftPromptResponse names the draft's test chat. When refused is set nothing was sent: restart says a new
// test chat would take the message, and problems are the draft's own settings to fix. Otherwise each
// problem is a variant, or with an empty variant the live agent, that does not answer the message, and why.
message DraftPromptResponse {
  string test_chat = 1;
  string refused = 2;
  bool restart = 3;
  repeated AgentDraftProblem problems = 4;
}

// DraftLayersRequest asks which layers hold an agent named as draft id, and what saving variant to
// destination, "workspace" or a configured overlay's spec, would replace and write.
message DraftLayersRequest {
  string id = 1;
  string variant = 2;
  string destination = 3;
}

// AgentLayer is one layer's file for the draft's name: layer is "built-in", a configured overlay's spec, or
// "workspace"; ref is an overlay's pinned ref; file is unset where the layer has none.
message AgentLayer {
  string layer = 1;
  string ref = 2;
  optional string file = 3;
}

// DraftLayersResponse lists the layers in precedence order, each later one winning. hidden_by names the
// later layer whose file hides the destination, whatever its bytes; replaces names the earlier layer whose
// agent the save takes over, so its updates stop reaching this workspace; recreated says startup copies the
// built-in agent into workspace agents/ again, which hides an overlay destination; next is the file the save
// writes, settings in the standard order and comments dropped. For an overlay destination, branch is the
// branch a save pushes to, or unpushable says why it cannot push there.
message DraftLayersResponse {
  repeated AgentLayer layers = 1;
  string hidden_by = 2;
  string replaces = 3;
  bool recreated = 4;
  string next = 5;
  string branch = 6;
  string unpushable = 7;
}

// SaveDraftRequest saves variant of draft id to destination. reviewed says the caller reviewed the
// destination's file reviewed_file, unset when it had none; that file becomes what the save expects to
// find there. To a Git overlay, pull_request opens a pull request instead of pushing to its branch.
message SaveDraftRequest {
  string id = 1;
  string variant = 2;
  string destination = 3;
  bool reviewed = 4;
  optional string reviewed_file = 5;
  bool pull_request = 6;
}

// AgentDraftReviewSetting is one setting's YAML in the base, the destination's file and the draft, empty
// where absent; mode is the setting "mode". theirs says the review starts on the file's value, which only
// the file changed; both says the file and the draft each changed it differently.
message AgentDraftReviewSetting {
  string key = 1;
  string base = 2;
  string live = 3;
  string draft = 4;
  bool theirs = 5;
  bool both = 6;
}

// AgentDraftReview is a destination file that changed since the draft began, or since the caller reviewed
// it: the base the draft expected, the file now and the draft's file, the settings any of them changed, and
// the instructions edit, on revision, that brings the file's changes into the draft's variant.
message AgentDraftReview {
  int64 revision = 1;
  optional string base = 2;
  optional string live = 3;
  string draft = 4;
  repeated AgentDraftReviewSetting settings = 5;
  repeated AgentDraftSplice splices = 6;
}

// SaveDraftResponse is the draft's save state after a save: live, waiting for a Git overlay's merge, or
// editing when the draft changed during the save or the reload loaded another file. When refused is set nothing was written: problems are the
// variant's settings that do not load, and review the destination's changes to review before saving again.
message SaveDraftResponse {
  string save_state = 1;
  string refused = 2;
  repeated AgentDraftProblem problems = 3;
  AgentDraftReview review = 4;
}

// StopWaitingRequest returns draft id from waiting for a merge to editing; its pull request stays open.
message StopWaitingRequest { string id = 1; }

message UpdateSessionRequest {
  string id = 1;
  optional bool pinned = 2;
  optional string name = 3;
  reserved 4, 5;
  // Toggles a tag a person chose: any tag on a remote OpenCode session, or one its agent allows.
  optional string tag = 6;
}

message UpdateSessionResponse {}

message ProtocolRequest {}

message ProtocolResponse {
  string proto_sha256 = 1;
}

message QueueItem {
  string id = 1;
  string text = 2;
  repeated Attachment attachments = 3;
  PromptDelivery delivery = 4;
  string principal = 5;
  optional string edit_text = 6;
}

message ListQueueRequest {
  string id = 1;
}

message ListQueueResponse {
  repeated QueueItem items = 1;
}

message QueueItemRequest {
  string id = 1;
  string item_id = 2;
  string text = 3;
}

message QueueItemResponse {}

message ReorderQueueRequest {
  string id = 1;
  repeated string item_ids = 2;
}

message MoveToBackgroundRequest {
  string conversation_id = 1;
}

message MoveToBackgroundResponse {
  bool moved = 1;
}

message StopBackgroundJobRequest {
  string conversation_id = 1;
  string job_id = 2;
}

message StopBackgroundJobResponse {
  // False when the job had already finished.
  bool stopped = 1;
}

message SessionEntriesRequest {
  string id = 1;
}

message SessionEntryMeta {
  int64 id = 1;
  string type = 2;
  string timestamp = 3;
}

message ListSessionEntriesResponse {
  repeated SessionEntryMeta entries = 1;
}

message SessionEntryData {
  int64 id = 1;
  string json = 2;
}

message LoadSessionEntriesResponse {
  repeated SessionEntryData entries = 1;
}

message DeleteSessionEntriesResponse {
  int64 deleted = 1;
}

message IdentityRequest {}

// sandbox_error is why emulated shells cannot run, empty when they can or no agent uses one. limited is set,
// true, only for a person the config's permissions limit to their spaces.
message IdentityResponse { string username = 1; string principal = 2; string sandbox_error = 3; optional bool limited = 4; }

message ReloadRequest { string reason = 1; }

message ReloadResponse { string message = 1; }

message VoiceRequest {
  string conversation_id = 1;
  string sdp = 2;
  // One of the agent's voices; empty uses the provider's default.
  string voice = 3;
}

enum VoiceSettingsAction {
  reserved 1, 2;
  reserved "START", "RESET";
  READ = 0;
  // UPDATE stores the agent, voice and transcript fields that are set; agent must be sticky: user.
  UPDATE = 3;
}

message VoiceSettingsRequest {
  reserved 2;
  reserved "conversation_id";
  VoiceSettingsAction action = 1;
  optional string agent = 3;
  optional string voice = 4;
  optional bool transcript = 5;
}

// VoiceSettingsResponse is the caller's voice settings; a call goes to agent's sticky session.
message VoiceSettingsResponse {
  reserved 1;
  reserved "conversation_id";
  string agent = 2;
  string voice = 3;
  bool transcript = 4;
}

// A Web space every person shares.
message Space {
  string id = 1;
  string name = 2;
}

// One of a person's Web tabs: its location, group, and space ids, and a Search page's content.
message Tab {
  reserved 2, 3;
  reserved "pinned", "preview";

  string path = 1;
  string group = 4;
  string space = 5;
  SearchPage search = 6;
}

// SearchPage is a Search tab's name and its searches, active naming the shown one by id. board is the style id of a
// Dashboard, whose searches are its lanes; empty is an ordinary Search page.
message SearchPage {
  string name = 1;
  repeated SavedSearch searches = 2;
  string active = 3;
  string board = 4;
}

// SavedSearch is one search on a Search page: its id, the name the person gave it, and its query. notify marks a
// Dashboard lane whose newly entering sessions raise a desktop notification.
message SavedSearch {
  string id = 1;
  string name = 2;
  string query = 3;
  bool notify = 4;
}

message TabGroup {
  string id = 1;
  string name = 2;
  string color = 3;
  bool collapsed = 4;
}

// TabState is one person's Web tabs and groups, the space they are in, the last tab of each space by space id, and
// the person's own order of Shared tabs by location.
message TabState {
  reserved 5;
  reserved "placement";

  repeated Tab tabs = 1;
  repeated TabGroup groups = 2;
  string space = 3;
  map<string, string> last = 4;
  repeated string shared_order = 6;
}

// SharedTab is one tab in a space's Shared group, which every Web user sees: its space id and location, and for a
// Search tab its one page.
message SharedTab {
  string space = 1;
  string path = 2;
  // A Search tab's one page, which everyone in the space sees and edits.
  SearchPage search = 3;
  // base is, in edit_shared, the page the edit was made from; an edit of a page that changed since is refused as stale.
  SearchPage base = 4;
}

// TopShelf is one person's Top Shelf: tabs of any RocketClaw kept above the space picker, in their order, and whether
// they collapsed it.
message TopShelf {
  repeated ShelfTab tabs = 1;
  bool collapsed = 2;
}

// ShelfTab is a tab on the Top Shelf: the RocketClaw it is on, "" for this one, its space id and location there, and
// for a Search tab the page it held when shelved.
message ShelfTab {
  string server = 1;
  string space = 2;
  string path = 3;
  SearchPage search = 4;
}

// AttentionAction is what a person does to the attention of their tabs.
enum AttentionAction {
  MARK_READ = 0;
  // A mark the person sets raises no notification.
  MARK_UNREAD = 1;
  // Park sets the tab aside until until, or until unparked when until is empty.
  PARK = 2;
  UNPARK = 3;
  // Park until done sets a session's tab aside until its next turn ends; other locations are skipped.
  PARK_UNTIL_DONE = 4;
  // Auto-park makes each prompt the caller sends a session park its tab until it is done, and stop auto-park makes
  // none, over their choice for every session; other locations are skipped.
  AUTO_PARK = 5;
  STOP_AUTO_PARK = 6;
  // Sent says the caller sent each session a prompt: those they auto-park park until they are done.
  SENT = 7;
}

// AttentionChange does action to the caller's attention on the tab locations paths. until is an RFC 3339 time.
message AttentionChange {
  repeated string paths = 1;
  AttentionAction action = 2;
  string until = 3;
}

// TabsRequest saves the caller's tab state when set, else creates, renames, or deletes one space,
// adds one tab to or removes one from a space's Shared group, changes the caller's attention on tabs, replaces the
// caller's Top Shelf, or sets whether they auto-park every session.
// revision is the saved revision the state was made from.
message TabsRequest {
  reserved 8, 9, 10, 13;
  reserved "swap_shared", "mute", "unmute", "mark_unread";

  TabState state = 1;
  string create_space = 2;
  Space rename_space = 3;
  string delete_space = 4;
  int64 revision = 5;
  SharedTab share = 6;
  SharedTab unshare = 7;
  // edit_shared saves a Shared Search page's one page; a page no longer shared stays unshared.
  SharedTab edit_shared = 11;
  TopShelf top_shelf = 12;
  AttentionChange attention = 14;
  // auto_park sets whether the caller auto-parks every session they chose nothing for.
  optional bool auto_park = 15;
}

// TabsResponse is every space, oldest first, and the caller's saved tab state and its revision.
// stale reports a refused save: the state was made from an older revision than the one saved, or a Shared Search
// page edit made from a page that has since changed.
// shared is every space's Shared tabs, oldest added first. top_shelf is the caller's Top Shelf.
message TabsResponse {
  reserved 6;
  reserved "mutes";

  repeated Space spaces = 1;
  TabState state = 2;
  int64 revision = 3;
  bool stale = 4;
  repeated SharedTab shared = 5;
  // unshared is the Search page a Search tab taken out of Shared held.
  SearchPage unshared = 7;
  TopShelf top_shelf = 8;
  // closed is the caller's last 50 closed tabs, newest first, each with the space it was in and a Search tab's page.
  repeated Tab closed = 9;
  // auto_park is whether the caller auto-parks every session they chose nothing for.
  bool auto_park = 10;
}

// The first event answers the browser's SDP offer; the last ends the call.
// A notice in between reports a hand-off the agent could not accept; typed
// says a typed message superseded voice, so the browser mutes the voice
// model until it answers the person's next speech. reply is a final reply
// too long to speak, for the browser to show as written. reconnecting is
// true while a Codex sideband reconnects and false once it is back.
message VoiceEvent {
  oneof event {
    VoiceAnswer answer = 1;
    VoiceEnded ended = 2;
    string notice = 3;
    bool typed = 4;
    string reply = 5;
    bool reconnecting = 6;
  }
}

// route names the GPT-Live wire dialect: public or codex.
message VoiceAnswer {
  string sdp = 1;
  string route = 2;
}

// reason is stopped, replaced, expired, safety, closed, lost or error.
message VoiceEnded {
  string reason = 1;
}

service Web {
  rpc UploadAttachment(stream Attachment) returns (Attachment);
  rpc DownloadAttachment(Attachment) returns (stream Attachment);
  rpc ListSessions(ListSessionsRequest) returns (stream ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc Join(JoinRequest) returns (stream ConversationChange);
  rpc Voice(VoiceRequest) returns (stream VoiceEvent);
  rpc VoiceSettings(VoiceSettingsRequest) returns (VoiceSettingsResponse);
  rpc Tabs(TabsRequest) returns (TabsResponse);
  rpc Prompt(PromptRequest) returns (PromptResponse);
  rpc ListCronJobs(ListCronJobsRequest) returns (ListCronJobsResponse);
  rpc RunCronJob(RunCronJobRequest) returns (RunCronJobResponse);
  rpc GetPage(PageRequest) returns (Page);
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);
  rpc StageRevert(StageRevertRequest) returns (StageRevertResponse);
  rpc ClearRevert(ClearRevertRequest) returns (ClearRevertResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc SearchSessions(SearchSessionsRequest) returns (SearchSessionsResponse);
  rpc Board(BoardRequest) returns (BoardResponse);
  rpc SlackNames(SlackNamesRequest) returns (SlackNamesResponse);
  rpc Handoff(HandoffRequest) returns (HandoffResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc ListConfig(ListConfigRequest) returns (ListConfigResponse);
  rpc TestModel(TestModelRequest) returns (TestModelResponse);
  rpc CreateAgentDraft(CreateAgentDraftRequest) returns (AgentDraft);
  rpc ListAgentDrafts(ListAgentDraftsRequest) returns (ListAgentDraftsResponse);
  rpc GetAgentDraft(GetAgentDraftRequest) returns (GetAgentDraftResponse);
  rpc ApplyAgentDraftOp(ApplyAgentDraftOpRequest) returns (ApplyAgentDraftOpResponse);
  rpc SetAgentDraftPresence(SetAgentDraftPresenceRequest) returns (SetAgentDraftPresenceResponse);
  rpc AgentSettings(AgentSettingsRequest) returns (AgentSettingsResponse);
  rpc DraftPrompt(DraftPromptRequest) returns (DraftPromptResponse);
  rpc RestartDraftChat(RestartDraftChatRequest) returns (DraftPromptResponse);
  rpc DraftLayers(DraftLayersRequest) returns (DraftLayersResponse);
  rpc SaveDraft(SaveDraftRequest) returns (SaveDraftResponse);
  rpc StopWaiting(StopWaitingRequest) returns (SaveDraftResponse);
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  rpc Protocol(ProtocolRequest) returns (ProtocolResponse);
  rpc Identity(IdentityRequest) returns (IdentityResponse);
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc RemoveQueueItem(QueueItemRequest) returns (QueueItemResponse);
  rpc SteerQueueItem(QueueItemRequest) returns (QueueItemResponse);
  rpc PopQueueItem(QueueItemRequest) returns (QueueItemResponse);
  rpc EditQueueItem(QueueItemRequest) returns (QueueItemResponse);
  rpc ReorderQueue(ReorderQueueRequest) returns (QueueItemResponse);
  rpc MoveToBackground(MoveToBackgroundRequest) returns (MoveToBackgroundResponse);
  rpc StopBackgroundJob(StopBackgroundJobRequest) returns (StopBackgroundJobResponse);
  rpc ListSessionEntries(SessionEntriesRequest) returns (ListSessionEntriesResponse);
  rpc LoadSessionEntries(SessionEntriesRequest) returns (LoadSessionEntriesResponse);
  rpc DeleteSessionEntries(SessionEntriesRequest) returns (DeleteSessionEntriesResponse);
}
