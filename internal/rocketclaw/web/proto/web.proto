syntax = "proto3";

package rpc;

option go_package = "github.com/Rocketable/platform/internal/rocketclaw/frontend/rpc";

message ListSessionsRequest {}

message Session {
  string id = 1;
  string title = 2;
  string preview = 3;
  string updated_at = 4;
  string agent = 5;
  reserved 6;
  repeated string allowed_agents = 7;
  bool running = 8;
  bool pinned = 9;
  string name = 10;
  reserved 11;
  reserved 12;
  string forked_from = 13;
  repeated string tags = 14;
  // The chat's recorded origin is a cron run, even after human follow-ups.
  bool cron = 15;
  string cron_name = 16;
}

message HistoryRequest {
  string id = 1;
  string source_conversation_id = 2;
  reserved 3;
  // Opaque inventory returned by the last applied History response.
  string revision = 4;
  // Positive limit returns only the newest limit saved entries plus running
  // turns, and follows only those entries in revision.
  int32 limit = 5;
  // Positive before reads a settled page of entries older than this saved-entry
  // ID: the newest limit of them, or all from saved-entry ID from onward.
  int64 before = 6;
  int64 from = 7;
}

message HistoryResponse {
  repeated TranscriptEvent messages = 1;
  // JSON object describing the chat's origin. Empty means no origin.
  string origin = 2;
  repeated string delegations = 3;
  string revision = 10;
  bool reset = 4;
  repeated string replaced_keys = 5;
  repeated string removed_keys = 6;
  repeated string entry_keys = 7;
  bool running = 8;
  string terminal = 9;
  // Saved-entry ID where these entries begin; zero means the beginning.
  int64 start = 11;
  // Older saved entries exist before start.
  bool more = 12;
  bool revert_eligible = 13;
  string revert_message_id = 14;
  bool can_undo = 15;
  // An allowed agent's execute or task call runs attached, so MoveToBackground has work to move.
  bool movable = 16;
  // Background Jobs running or holding an undelivered Completion Note, including those of hidden
  // cron and External MCP runs whose destination is this conversation.
  repeated BackgroundJob background_jobs = 17;
}

// A listed Background Job, or the job a Completion Note reports.
message BackgroundJob {
  string job_id = 1;
  // execute, task, or subagent_wake.
  string kind = 2;
  // running, completed, failed, stopped, or killed.
  string state = 3;
  string label = 4;
  string tool_call_id = 5;
  // Child-session key of the subagent a task or subagent_wake job runs.
  string subagent_key = 6;
  // user or agent, for a stopped job.
  string stopped_by = 7;
  // The job of a hidden run whose destination is this conversation; its transcript is not here.
  bool hidden = 8;
  // The job's Completion Note text, in TranscriptEvent.completion_notes only.
  string note = 9;
}

message StageRevertRequest { string id = 1; string message_id = 2; }
message StageRevertResponse { string revert_message_id = 1; TranscriptEvent prompt = 2; }
message ClearRevertRequest { string id = 1; }
message ClearRevertResponse {}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string owner = 2;
  bool upstream_success = 3;
  bool summaries_complete = 4;
}

message CreateSessionRequest {
  string name = 1;
  string agent = 2;
  string source_conversation_id = 3;
}

message CreateSessionResponse {
  string id = 1;
}

message ForkSessionRequest {
  string id = 1;
  string before = 2;
}

message ForkSessionResponse {
  string id = 1;
  TranscriptEvent prompt = 2;
}

message SearchMessagesRequest { string query = 1; }
message MessageMatch {
  string conversation_id = 1;
  TranscriptEvent message = 2;
}
message SearchMessagesResponse {
  repeated MessageMatch matches = 1;
  repeated string tag_ids = 2;
  bool index_complete = 3;
}
message SearchOriginsRequest { string query = 1; }
message OriginMatch {
  string conversation_id = 1;
  // Lowercased origin search text containing the query.
  string text = 2;
}
message SearchOriginsResponse { repeated OriginMatch matches = 1; }

// SlackNamesRequest asks for display names of Slack IDs.
message SlackNamesRequest {
  repeated string ids = 1;
}

// SlackNamesResponse maps IDs to bare display strings without a leading @ or #.
// The web prepends those sigils. Unresolved IDs are omitted.
message SlackNamesResponse {
  map<string, string> names = 1;
}
message HandoffRequest { string id = 1; }
message HandoffResponse { string document = 1; }

message JoinRequest {
  string id = 1;
}

// Wake-up hints only. History returns the revision actually read.
message ConversationChange {
  string conversation_id = 1;
  string revision = 2;
}

message TranscriptEvent {
  string text = 1;
  reserved 2;
  string role = 3;
  bool complete = 4;
  string turn_id = 5;
  string tool_call_id = 6;
  string tool_name = 7;
  repeated Attachment attachments = 8;
  string message_id = 9;
  string agent = 10;
  string model = 11;
  optional string reasoning_effort = 12;
  string origin = 13;
  string header = 14;
  string entry_key = 15;
  string item_id = 16;
  string input_id = 17;
  // Fixed public lifecycle label; independent of the parent turn's running state.
  string state = 18;
  string parent_id = 19;
  string principal = 20;
  // Completion Notes this system input delivers, in order, from their stored jobs.
  repeated BackgroundJob completion_notes = 21;
  // Delegation History a task call's row opens: the subagent it started or continued.
  string delegation = 22;
  // Delegation History a reviewed call's row opens: its automatic permission review.
  string review = 23;
}

// Attachment download frames carry at most 256 KiB. History carries metadata only.
message Attachment {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
  bool original_unverified = 5;
  bytes data = 6;
  string conversation_id = 7;
}

enum PromptDelivery {
  STEER = 0;
  QUEUE = 1;
  STASH = 2;
}

message PromptRequest {
  string id = 1;
  string text = 2;
  PromptDelivery delivery = 3;
  repeated string attachment_ids = 4;
  string message_id = 5;
}

message PromptResponse {
  string private_text = 1;
}

message CronJob {
  string stem = 1;
  string status = 2;
  string last_run = 3;
  string next_run = 4;
  string schedule = 5;
  string body = 6;
  string agent = 7;
  string channel = 8;
  repeated string upcoming = 9;
  string origin = 10;
}

message Agent {
  string name = 1;
  string model = 2;
  string reasoning = 3;
  string description = 4;
  string verbosity = 5;
  string prompt = 6;
  string permissions = 7;
  string origin = 8;
}

message ListAgentsRequest { string conversation_id = 1; }

message ListAgentsResponse {
  repeated Agent agents = 1;
  string current_agent = 2;
}

message Skill {
  string name = 1;
  string description = 2;
  string license = 3;
  string compatibility = 4;
  string content = 5;
  string origin = 6;
}

message ListSkillsRequest { string agent = 1; }

message ListSkillsResponse {
  repeated Skill skills = 1;
}

message Workflow {
  string name = 1;
  string description = 2;
}

message ListWorkflowsRequest {}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
}

message ListCronJobsRequest {}

message ListCronJobsResponse {
  repeated CronJob jobs = 1;
}

message RunCronJobRequest {
  string stem = 1;
}

message RunCronJobResponse {
  string id = 1;
}

message AnswerQuestionRequest {
  string ask_id = 1;
  string answer = 2;
  bool dismiss = 3;
}

message AnswerQuestionResponse {}

message ConfigModel {
  string name = 1;
  string model = 2;
}

message ConfigChannel {
  string channel = 1;
  repeated string agents = 2;
}

message ConfigView {
  string workspace = 1;
  repeated string overlays = 2;
  repeated ConfigModel models = 3;
  repeated ConfigChannel slack_channels = 4;
  repeated string mcp_servers = 5;
  string logging_level = 6;
  string auto_approver_model = 7;
  bool instrumentation_enabled = 8;
  bool mcp_external = 9;
  reserved 10;
  string tailscale_user = 11;
}

message ListConfigRequest {}

message ListConfigResponse {
  ConfigView config = 1;
}

message UpdateSessionRequest {
  string id = 1;
  optional bool pinned = 2;
  optional string name = 3;
  reserved 4, 5;
}

message UpdateSessionResponse {}

message ProtocolRequest {}

message ProtocolResponse {
  string proto_sha256 = 1;
}

message QueueItem {
  string id = 1;
  string text = 2;
  repeated Attachment attachments = 3;
  PromptDelivery delivery = 4;
  string principal = 5;
}

message ListQueueRequest {
  string id = 1;
}

message ListQueueResponse {
  repeated QueueItem items = 1;
}

message QueueItemRequest {
  string id = 1;
  string item_id = 2;
}

message QueueItemResponse {}

message ReorderQueueRequest {
  string id = 1;
  repeated string item_ids = 2;
}

message MoveToBackgroundRequest {
  string conversation_id = 1;
}

message MoveToBackgroundResponse {
  bool moved = 1;
}

message StopBackgroundJobRequest {
  string conversation_id = 1;
  string job_id = 2;
}

message StopBackgroundJobResponse {
  // False when the job had already finished.
  bool stopped = 1;
}

message SessionEntriesRequest {
  string id = 1;
}

message SessionEntryMeta {
  int64 id = 1;
  string type = 2;
  string timestamp = 3;
}

message ListSessionEntriesResponse {
  repeated SessionEntryMeta entries = 1;
}

message SessionEntryData {
  int64 id = 1;
  string json = 2;
}

message LoadSessionEntriesResponse {
  repeated SessionEntryData entries = 1;
}

message DeleteSessionEntriesResponse {
  int64 deleted = 1;
}

message IdentityRequest {}

message IdentityResponse { string username = 1; string principal = 2; }

service Web {
  rpc UploadAttachment(stream Attachment) returns (Attachment);
  rpc DownloadAttachment(Attachment) returns (stream Attachment);
  rpc ListSessions(ListSessionsRequest) returns (stream ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc Join(JoinRequest) returns (stream ConversationChange);
  rpc Prompt(PromptRequest) returns (PromptResponse);
  rpc ListCronJobs(ListCronJobsRequest) returns (ListCronJobsResponse);
  rpc RunCronJob(RunCronJobRequest) returns (RunCronJobResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc ForkSession(ForkSessionRequest) returns (ForkSessionResponse);
  rpc StageRevert(StageRevertRequest) returns (StageRevertResponse);
  rpc ClearRevert(ClearRevertRequest) returns (ClearRevertResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc SearchOrigins(SearchOriginsRequest) returns (SearchOriginsResponse);
  rpc SlackNames(SlackNamesRequest) returns (SlackNamesResponse);
  rpc Handoff(HandoffRequest) returns (HandoffResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc ListConfig(ListConfigRequest) returns (ListConfigResponse);
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  rpc Protocol(ProtocolRequest) returns (ProtocolResponse);
  rpc Identity(IdentityRequest) returns (IdentityResponse);
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc RemoveQueueItem(QueueItemRequest) returns (QueueItemResponse);
  rpc SteerQueueItem(QueueItemRequest) returns (QueueItemResponse);
  rpc PopQueueItem(QueueItemRequest) returns (QueueItemResponse);
  rpc ReorderQueue(ReorderQueueRequest) returns (QueueItemResponse);
  rpc MoveToBackground(MoveToBackgroundRequest) returns (MoveToBackgroundResponse);
  rpc StopBackgroundJob(StopBackgroundJobRequest) returns (StopBackgroundJobResponse);
  rpc ListSessionEntries(SessionEntriesRequest) returns (ListSessionEntriesResponse);
  rpc LoadSessionEntries(SessionEntriesRequest) returns (LoadSessionEntriesResponse);
  rpc DeleteSessionEntries(SessionEntriesRequest) returns (DeleteSessionEntriesResponse);
}
