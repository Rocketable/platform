<!doctype html>
<html lang="en" class="font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RocketClaw</title>
    <script>(() => { const mode = localStorage.getItem("theme") || "system"; const root = document.documentElement; root.classList.toggle("dark", mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)); const palette = localStorage.getItem("palette"); const known = ["neutral", "harbor", "grove", "ember", "violet", "rose", "sand", "lagoon", "slate", "copper", "ink", "signal", "go-playground", "go-sources"]; root.dataset.palette = known.includes(palette) ? palette : "neutral"; })();</script>
  </head>
  <body><div id="root"></div></body>
</html>
