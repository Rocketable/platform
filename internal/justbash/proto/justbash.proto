syntax = "proto3";

package justbash;

option go_package = "github.com/Rocketable/platform/internal/justbash/justbashpb";

// Sandbox is the RocketClaw side of a just-bash agent's bash call. The wrapper calls it with the token
// of the turn that started the call and the name of the agent the call runs for.
service Sandbox {
  // Setup returns what the wrapper needs to build the call's just-bash.
  rpc Setup(SetupRequest) returns (SetupResponse);
  // RunCommand runs one of the agent's approved host commands on the host.
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  // Fetch makes a network request on the sandbox's behalf when the agent's rules allow it.
  rpc Fetch(FetchRequest) returns (FetchResponse);
}

message SetupRequest {
  string token = 1;
  string agent = 2;
}

message SetupResponse {
  // The host folder mounted read-write at the same absolute path.
  string working_directory = 1;
  // Variables added to the call's environment: the agent's secrets.
  map<string, string> env = 2;
  // Names of the agent's approved host commands.
  repeated string commands = 3;
}

message RunCommandRequest {
  string token = 1;
  string agent = 2;
  string name = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  string cwd = 6;
  bytes stdin = 7;
}

message RunCommandResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
}

message FetchRequest {
  string token = 1;
  string agent = 2;
  string url = 3;
  string method = 4;
  map<string, string> headers = 5;
  bytes body = 6;
  bool follow_redirects = 7;
  int32 max_redirects = 8;
  int64 timeout_ms = 9;
}

message Redirect {
  int32 status = 1;
  string status_text = 2;
  map<string, string> headers = 3;
}

message FetchResponse {
  int32 status = 1;
  string status_text = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string url = 5;
  repeated Redirect redirect_chain = 6;
}
