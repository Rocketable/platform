\* The design: two root mentions and a mention in the first one's thread, each delivered up to twice in any order,
\* two tool-call steps per turn, one crash anywhere.
SPECIFICATION Spec
CONSTANTS
    Agents = {"a1"}
    InitAgent = "a1"
    Roots = {1, 2}
    ThreadMentions = {3}
    WebItems = {}
    AgentItems = {}
    ReplyMentions = {}
    ThreadWeb = {8}
    ThreadWrites = {}
    Dups = 1
    MaxCalls = 2
    MaxCrashes = 1
    MaxStops = 0
    CfgFlips = 0
    KindFlips = 0
    Mutation = "none"
INVARIANTS OneOwner OneAdmission NoClobber HeldUntilRootSettles RatchetHonored ReplyWhereTurnLives OneReply OneRoot
    FooterMatchesSession OnlySlackAgentsRun StopPrecise SessionAgentFixed
CHECK_DEADLOCK FALSE
