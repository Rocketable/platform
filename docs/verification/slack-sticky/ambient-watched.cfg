\* The design with ambient listening in the watched channel: root mention 1, a top-level message and a Report
\* Thread reply, each message and the mention's `message` copy delivered up to twice in any order, one crash.
SPECIFICATION Spec
CONSTANTS
    Agents = {"a1"}
    InitAgent = "a1"
    Roots = {1}
    ThreadMentions = {}
    WebItems = {}
    AgentItems = {}
    ReplyMentions = {}
    ThreadWeb = {}
    ThreadWrites = {}
    Dups = 1
    MaxCalls = 1
    MaxCrashes = 1
    MaxStops = 0
    CfgFlips = 0
    KindFlips = 0
    Mutation = "none"
    AmbientOn = TRUE
    JoinedReplies = {}
    WatchedRoots = {10}
    Edits = {}
    ReportReplies = {12}
INVARIANTS OneOwner OneAdmission NoClobber HeldUntilRootSettles RatchetHonored ReplyWhereTurnLives OneReply OneRoot
    FooterMatchesSession OnlySlackAgentsRun StopPrecise SessionAgentFixed MentionNeverAmbient NoAmbientInReport
    NoAmbientUnderMentionRoot AmbientInThread SilentPostsNothing AmbientStatusAfterWork
CHECK_DEADLOCK FALSE
