    Agents = {"a1", "a2"}
    InitAgent = "a1"
    Roots = {1}
    ThreadMentions = {}
    WebItems = {}
    AgentItems = {}
    ReplyMentions = {}
    ThreadWeb = {}
    ThreadWrites = {}
    Dups = 0
    MaxCalls = 1
    MaxCrashes = 1
    MaxStops = 0
    CfgFlips = 1
    KindFlips = 1
    Mutation = "none"
    AmbientOn = TRUE
    JoinedReplies = {9}
    WatchedRoots = {10}
    Edits = {}
    ReportReplies = {}
INVARIANTS OneOwner OneAdmission NoClobber HeldUntilRootSettles RatchetHonored ReplyWhereTurnLives OneReply OneRoot
    FooterMatchesSession OnlySlackAgentsRun StopPrecise SessionAgentFixed MentionNeverAmbient NoAmbientInReport
    NoAmbientUnderMentionRoot AmbientInThread SilentPostsNothing AmbientStatusAfterWork
CHECK_DEADLOCK FALSE
