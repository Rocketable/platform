\* Witness, must fail: once Slack is done with a mention (and, for a root, with its thread mention), its admission
\* record drops out of the window.
SPECIFICATION Spec
CONSTANTS
    Agents = {"a1", "a2"}
    InitAgent = "a1"
    Roots = {1}
    ThreadMentions = {3}
    WebItems = {}
    AgentItems = {}
    ReplyMentions = {}
    ThreadWeb = {}
    ThreadWrites = {}
    Dups = 1
    MaxCalls = 1
    MaxCrashes = 0
    MaxStops = 0
    CfgFlips = 0
    KindFlips = 0
    Mutation = "none"
    AmbientOn = FALSE
    JoinedReplies = {}
    WatchedRoots = {}
    Edits = {}
    ReportReplies = {}
INVARIANTS NoExpiry
CHECK_DEADLOCK FALSE
