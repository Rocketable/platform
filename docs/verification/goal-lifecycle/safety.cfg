\* As built: every safety invariant holds, and an active goal always has a turn running or queued until it ends.
SPECIFICATION Spec
CONSTANTS
    MaxTurns = 2
    MaxStops = 2
    MaxResumes = 2
    MaxCrashes = 1
    Mutation = "none"
INVARIANTS AtMostOneContinuation ClaimMatchesQueue TurnsWithinBudget
PROPERTIES GoalKeepsMoving GoalEnds
CHECK_DEADLOCK FALSE
