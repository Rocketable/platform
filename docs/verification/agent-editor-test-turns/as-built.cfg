  LayerOnRoster = TRUE
  SaveAtomic = TRUE
  ShadowOwnFraming = TRUE
  MaxJobs = 1
  SubJobs = TRUE
  WakeFix = "inert"
  PageWakeAOnly = FALSE
  MaxTyped = 0
  Flush = "all"
  ReplayFrom = "server"
  StashInTx = FALSE
  MaxRecordFailures = 0
  MaxRefusals = 1
  RefuseSwitches = FALSE
  MaxTeamSends = 1
  RestartWhileSending = TRUE
  SendWhileRestarting = TRUE
INVARIANTS
  VersionAtSendDraft
  VersionAtSendLive
  LabelTruthful
  AlignedPerMessage
  RestartIsolation
