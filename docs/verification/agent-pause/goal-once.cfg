\* As built, no crash: a resume never queues a second goal continuation. (A crash adds a separate startup race
\* of the same shape, outside the pause: StartActiveTurns may finish the resumed goal turn before StartActiveGoals
\* reads HasActiveTurn.)
SPECIFICATION Spec
CONSTANTS
    Msgs = {}
    QItems = {1}
    Writes = {}
    Notes = {}
    Scheds = {}
    Recurs = {}
    GoalMode = "bounded"
    GoalTurns = 1
    MaxToggles = 2
    MaxCrashes = 0
    Mutation = "none"
    SplitAdmit = FALSE
INVARIANT AtMostOneContinuation
CHECK_DEADLOCK FALSE
