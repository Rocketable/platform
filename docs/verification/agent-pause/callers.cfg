\* As built: a person's plain message and a one-time Scheduled Message; pause and resume; no crash. Callers are
\* released and held work runs once the chat stays live.
SPECIFICATION Spec
CONSTANTS
    Msgs = {1}
    QItems = {}
    Writes = {}
    Notes = {}
    Scheds = {2}
    Recurs = {}
    GoalMode = "none"
    GoalTurns = 0
    MaxToggles = 2
    MaxCrashes = 0
    Mutation = "none"
    SplitAdmit = FALSE
INVARIANTS InputClosedWhilePaused ForwardLookingPause PausedMessageNeverTurns NothingLost CompletionOwned
PROPERTIES HeldRunsAfterResume CallerReleased CallerReleasedWhenLive
CHECK_DEADLOCK FALSE
