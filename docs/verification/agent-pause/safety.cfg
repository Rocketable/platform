\* As built: a person's plain message and a one-time Scheduled Message; pause, resume, pause; no crash.
SPECIFICATION Spec
CONSTANTS
    Msgs = {1}
    QItems = {}
    Writes = {}
    Notes = {}
    Scheds = {2}
    Recurs = {}
    GoalMode = "none"
    GoalTurns = 0
    MaxToggles = 3
    MaxCrashes = 0
    Mutation = "none"
    SplitAdmit = FALSE
INVARIANTS InputClosedWhilePaused ForwardLookingPause PausedMessageNeverTurns NothingLost CompletionOwned
CHECK_DEADLOCK FALSE
