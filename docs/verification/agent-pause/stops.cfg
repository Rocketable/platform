\* As built: a goal that never finishes on its own; pause, resume, pause; one crash. A chat that stays paused
\* stops turning.
SPECIFICATION Spec
CONSTANTS
    Msgs = {}
    QItems = {}
    Writes = {}
    Notes = {}
    Scheds = {}
    Recurs = {}
    GoalMode = "forever"
    GoalTurns = 1
    MaxToggles = 3
    MaxCrashes = 1
    Mutation = "none"
    SplitAdmit = FALSE
INVARIANTS InputClosedWhilePaused ForwardLookingPause PausedMessageNeverTurns NothingLost CompletionOwned
PROPERTY StopsTurning
CHECK_DEADLOCK FALSE
