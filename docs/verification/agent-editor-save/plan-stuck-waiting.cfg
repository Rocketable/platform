\* Plan as written, Git overlay, no gh, one person: a merge the check cannot see keeps the draft waiting (expected: WaitingResolves violated).
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Mode = "overlay"
  HasGh = FALSE
  Outcomes = {"merge", "squash", "rebase", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes = {}
  MaxCrash = 1
  MaxFail = 1
  MaxThird = 1
  MaxCancel = 0
  MaxSaves = 2
  Poll = TRUE
  StopFair = TRUE
  EditLeaves = FALSE
INVARIANTS TypeOK
PROPERTIES WaitingResolves
