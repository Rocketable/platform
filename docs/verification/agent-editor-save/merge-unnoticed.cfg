\* Accepted, no polling: the save's own check sees the pull request open, GitHub merges it later, and nobody opens the draft or clicks Stop (expected: MergeResolves violated).
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Mode = "overlay"
  HasGh = TRUE
  Outcomes = {"merge", "squash", "close"}
  Kinds = {"pr"}
  Fixes <- AsBuilt
  MaxCrash = 0
  MaxFail = 1
  MaxThird = 1
  MaxCancel = 0
  MaxSaves = 2
  Poll = FALSE
  StopFair = FALSE
  EditLeaves = TRUE
INVARIANTS TypeOK NoInvalidLive StartupOK StaleNeedsReview SaveExclusive NoMixedLive HonestLive NoUndoClobber UndoUnreachable EditedNotLive NoStaleCheckEnd
PROPERTIES MergeResolves
