\* Reachability, Git overlay with gh as built: a merge check of an earlier save finishes while a later save waits (expected: ProbeNoStaleFinish violated).
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Mode = "overlay"
  HasGh = TRUE
  Outcomes = {"merge", "squash", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes <- AsBuilt
  MaxCrash = 1
  MaxFail = 1
  MaxThird = 1
  MaxCancel = 0
  MaxSaves = 2
  Poll = FALSE
  StopFair = TRUE
  EditLeaves = TRUE
INVARIANTS ProbeNoStaleFinish
