\* Git overlay save (push or pull request) as built, no gh, one disconnect at the claim or any later step: every safety property and both liveness properties hold.
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Mode = "overlay"
  HasGh = FALSE
  Outcomes = {"merge", "squash", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes <- AsBuilt
  MaxCrash = 1
  MaxFail = 1
  MaxThird = 1
  MaxCancel = 1
  MaxSaves = 2
  Poll = FALSE
  StopFair = TRUE
  EditLeaves = TRUE
INVARIANTS TypeOK NoInvalidLive StartupOK StaleNeedsReview SaveExclusive NoMixedLive HonestLive NoUndoClobber UndoUnreachable EditedNotLive NoStaleCheckEnd
PROPERTIES SavingResolves WaitingResolves
