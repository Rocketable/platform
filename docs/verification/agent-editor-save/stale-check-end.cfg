\* Before the same-pending check: a merge check that read an earlier save ends a later save's wait (expected: NoStaleCheckEnd violated).
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Mode = "overlay"
  HasGh = TRUE
  Outcomes = {"merge", "squash", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes <- WithoutSamePending
  MaxCrash = 1
  MaxFail = 1
  MaxThird = 1
  MaxCancel = 0
  MaxSaves = 2
  Poll = FALSE
  StopFair = TRUE
  EditLeaves = TRUE
INVARIANTS NoStaleCheckEnd
