\* Git overlay save as built, gh, two people saving, one disconnect, no crash: safety only.
SPECIFICATION Spec
CONSTANTS
  Users = {u1, u2}
  Mode = "overlay"
  HasGh = TRUE
  Outcomes = {"merge", "squash", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes <- AsBuilt
  MaxCrash = 0
  MaxFail = 1
  MaxThird = 1
  MaxCancel = 1
  MaxSaves = 2
  Poll = FALSE
  StopFair = TRUE
  EditLeaves = TRUE
INVARIANTS TypeOK NoInvalidLive StartupOK StaleNeedsReview SaveExclusive NoMixedLive HonestLive NoUndoClobber UndoUnreachable EditedNotLive NoStaleCheckEnd
