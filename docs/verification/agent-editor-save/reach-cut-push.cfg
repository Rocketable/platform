\* Reachability, Git overlay with gh as built: a disconnected save request still pushes or runs its merge check (expected: ProbeNoCutPush violated).
SPECIFICATION Spec
CONSTANTS
  Users = {u1}
  Mode = "overlay"
  HasGh = TRUE
  Outcomes = {"merge", "squash", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes <- AsBuilt
  MaxCrash = 1
  MaxFail = 1
  MaxThird = 1
  MaxCancel = 1
  MaxSaves = 2
  Poll = FALSE
  StopFair = TRUE
  EditLeaves = TRUE
INVARIANTS ProbeNoCutPush
