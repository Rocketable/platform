\* Earlier code: File submits diffed against the revision of the first keystroke. Changing a setting
\* back while the first submit is in flight is lost.
SPECIFICATION Spec
CONSTANTS
  Clients = {"a", "b"}
  FileClients = {"a"}
  MaxOps = 2
  OtherOps = 1
  SeedLen = 2
  Keys = {"k1"}
  Mode = "split"
  FileBody = "splices"
  FileDiff = "prefixsuffix"
  FileEdits = "contiguous"
  FileNeedsSync = TRUE
  FileRebase = "stale"
  SetMode = "pendingwins"
  FormEdits = {"set"}
  Assistant = FALSE
  DiffCap = 0
  RejectFile = TRUE
  OnReject = "drophead"
INVARIANTS
  OwnLastWrite
CHECK_DEADLOCK FALSE
