\* Git overlay save (push or PR), gh available, recommended fixes.
SPECIFICATION Spec
CONSTANTS
  Users = {u1, u2}
  Mode = "overlay"
  HasGh = TRUE
  MergeRule = "contains"
  Outcomes = {"merge", "squash", "rebase", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes = {"cas", "prevalidate", "reloadfirst", "atomicwrite", "targetbase", "cmpwrite", "snapcheck", "startreset", "stopwait"}
  MaxCrash = 1
  MaxFail = 1
  MaxThird = 1
INVARIANTS TypeOK NoInvalidLive StartupOK StaleNeedsReview SaveExclusive NoMixedLive HonestLive NoUndoClobber
PROPERTIES WaitingResolves SavingResolves
