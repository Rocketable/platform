\* Live captured at send, but a save writes the agent files one by one.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  MaxEdits = 2
  MaxSaves = 1
  MaxToggles = 2
  MaxRestarts = 1
  CaptureAt = "send"
  LiveCaptured = TRUE
  LabelFromUsed = TRUE
  RestartNewConv = TRUE
  KeyById = TRUE
  LayerOnRoster = TRUE
  SaveAtomic = FALSE
  ShadowOwnFraming = TRUE
INVARIANTS
  VersionAtSendDraft
  VersionAtSendLive
  LabelTruthful
  AlignedPerMessage
  RestartIsolation
  ReplaySameOrder
  RosterMatchesDraft
  FramingOwn
CHECK_DEADLOCK FALSE
