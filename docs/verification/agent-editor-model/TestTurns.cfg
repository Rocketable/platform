\* Fixed design: draft and live captured once at send, truthful labels, new conversation per
\* restart, answers keyed by message id, roster through the draft layer, atomic save, own framing.
SPECIFICATION Spec
CONSTANTS
  MaxMsgs = 2
  MaxEdits = 2
  MaxSaves = 1
  MaxToggles = 2
  MaxRestarts = 1
  CaptureAt = "send"
  LiveCaptured = TRUE
  LabelFromUsed = TRUE
  RestartNewConv = TRUE
  KeyById = TRUE
  LayerOnRoster = TRUE
  SaveAtomic = TRUE
  ShadowOwnFraming = TRUE
INVARIANTS
  VersionAtSendDraft
  VersionAtSendLive
  LabelTruthful
  AlignedPerMessage
  RestartIsolation
  ReplaySameOrder
  RosterMatchesDraft
  FramingOwn
CHECK_DEADLOCK FALSE
