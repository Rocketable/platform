\* Fixed design: op = list of splices (a delete splits around a concurrent insert);
\* File tab submits one contiguous change as one prefix/suffix splice, after its form ops are acked;
\* a remote setting write never overrides a pending local write to the same key.
SPECIFICATION Spec
CONSTANTS
  Clients = {"a", "b"}
  FileClients = {"a"}
  MaxOps = 2
  OtherOps = 1
  SeedLen = 2
  Mode = "split"
  FileDiff = "prefixsuffix"
  FileEdits = "contiguous"
  FileNeedsSync = TRUE
  SetMode = "pendingwins"
INVARIANTS
  Convergence
  NoLostEdit
  NoDuplicate
  OrderPreserved
  InvalidPrivate
  HistoryComplete
  SettingsLWW
  NoStuck
PROPERTIES
  InvalidNoRevision
CHECK_DEADLOCK FALSE
