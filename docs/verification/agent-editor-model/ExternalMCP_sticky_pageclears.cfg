\* Page turns the switch off when its editor sets sticky non-off; no server check: expect fail via a stale page.
SPECIFICATION Spec
CONSTANTS
  ServerStickyCheck = FALSE
  CheckOnCaptured = TRUE
  DraftWriteGuard = FALSE
  PageClearsOn = TRUE
  FreezeMode = "none"
  MetaRule = "real"
  ConflictCheck = "none"
  LiveSticky = "off"
  LivePolicy = "run"
  MaxMsgs = 2
  MaxRestarts = 1
  Callers = {"c1"}
INVARIANTS TypeOK OnlyStickyOff
