\* Git overlay save as the plan is written, no gh, contains-only rule.
SPECIFICATION Spec
CONSTANTS
  Users = {u1, u2}
  Mode = "overlay"
  HasGh = FALSE
  MergeRule = "contains"
  Outcomes = {"merge", "squash", "rebase", "close", "none"}
  Kinds = {"push", "pr"}
  Fixes = {}
  MaxCrash = 1
  MaxFail = 1
  MaxThird = 1
INVARIANTS TypeOK NoInvalidLive StartupOK StaleNeedsReview SaveExclusive NoMixedLive HonestLive NoUndoClobber
PROPERTIES WaitingResolves SavingResolves
