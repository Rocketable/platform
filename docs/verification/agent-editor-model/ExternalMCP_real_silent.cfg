\* Recommended design but an edited or dropped stored key is sent and silently ignored by the bridge: expect InboundHonest to fail.
SPECIFICATION Spec
CONSTANTS
  ServerStickyCheck = TRUE
  CheckOnCaptured = TRUE
  DraftWriteGuard = FALSE
  PageClearsOn = FALSE
  FreezeMode = "refuse"
  MetaRule = "real"
  ConflictCheck = "none"
  LiveSticky = "user"
  LivePolicy = "skip"
  MaxMsgs = 2
  MaxRestarts = 1
  Callers = {"c1"}
INVARIANTS TypeOK InboundHonest
