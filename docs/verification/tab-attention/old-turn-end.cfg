\* The earlier rule, where any turn end or news ends a park until it is done, with one browser window. TLC must find
\* DoneEndsOnlyWhenIdle violated: a turn end with more work waiting ends the park.
SPECIFICATION Spec
CONSTANTS
    Windows = {w1}
    MaxTime = 2
    MaxEvents = 3
    MaxTabMoves = 1
    ServerOwnsPark = FALSE
    ClientFiltersPark = FALSE
    SameFeed = TRUE
    JobChecksTimer = TRUE
    QuietMarks = TRUE
    QuietKeepsMark = TRUE
    SharedQuiet = FALSE
    TabPresence = TRUE
    DeferStale = TRUE
    ReopenQuiets = TRUE
    QuestionOnClosed = "due"
    WakeReaches = TRUE
    EndsAtIdle = FALSE
    FollowGates = TRUE
    MaxFollowMoves = 0
INVARIANTS DoneEndsOnlyWhenIdle
CHECK_DEADLOCK FALSE
