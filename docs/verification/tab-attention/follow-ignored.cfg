\* A server that ignores Follow, with one browser window. TLC must find NoMarkWhileUnfollowed
\* violated: the server marks a tab the person does not follow.
SPECIFICATION Spec
CONSTANTS
    Windows = {w1}
    MaxTime = 2
    MaxEvents = 3
    MaxTabMoves = 1
    ServerOwnsPark = FALSE
    ClientFiltersPark = FALSE
    SameFeed = TRUE
    JobChecksTimer = TRUE
    QuietMarks = TRUE
    QuietKeepsMark = TRUE
    SharedQuiet = FALSE
    TabPresence = TRUE
    DeferStale = TRUE
    ReopenQuiets = TRUE
    QuestionOnClosed = "due"
    WakeReaches = TRUE
    EndsAtIdle = TRUE
    FollowGates = FALSE
    MaxFollowMoves = 2
INVARIANTS NoMarkWhileUnfollowed
CHECK_DEADLOCK FALSE
