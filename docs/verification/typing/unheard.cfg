\* What the design as built does not promise: a watch that never heard Ana stop, as its events were full or it opened after the server took her not-typing report, shows her from an older typing report that arrives late, until it expires. Must find NoStaleAnywhere violated.
SPECIFICATION Spec
CONSTANTS
    Throttle = 1
    Expiry = 2
    MaxReports = 3
    Buffer = 1
    Ordered = TRUE
    Expires = TRUE
    KeyedWatch = TRUE
    SelfFilter = TRUE
INVARIANTS NoStaleAnywhere
CHECK_DEADLOCK FALSE
