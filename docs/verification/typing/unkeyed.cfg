\* Without the key on Typists, a watch keeps its typists when Bea moves to another chat, and shows Ana typing there. Must find NoCrossChat violated.
SPECIFICATION Spec
CONSTANTS
    Throttle = 1
    Expiry = 2
    MaxReports = 3
    Buffer = 1
    Ordered = TRUE
    Expires = TRUE
    KeyedWatch = FALSE
    SelfFilter = TRUE
INVARIANTS NoCrossChat
CHECK_DEADLOCK FALSE
