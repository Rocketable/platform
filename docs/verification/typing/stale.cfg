\* The design as built drops a report older than one the server took. Must find NeverStale violated.
SPECIFICATION Spec
CONSTANTS
    Throttle = 1
    Expiry = 2
    MaxReports = 3
    Buffer = 1
    Ordered = TRUE
    Expires = TRUE
    KeyedWatch = TRUE
    SelfFilter = TRUE
INVARIANTS NeverStale
CHECK_DEADLOCK FALSE
