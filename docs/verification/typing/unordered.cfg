\* Without the server dropping older reports, a typing report that a later not-typing one overtook brings Ana's pill back. Must find NoStaleReturn violated.
SPECIFICATION Spec
CONSTANTS
    Throttle = 1
    Expiry = 2
    MaxReports = 3
    Buffer = 1
    Ordered = FALSE
    Expires = TRUE
    KeyedWatch = TRUE
    SelfFilter = TRUE
INVARIANTS NoStaleReturn
CHECK_DEADLOCK FALSE
