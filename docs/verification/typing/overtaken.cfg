\* The design as built lets a report reach the server after a later one. Must find NeverOvertaken violated.
SPECIFICATION Spec
CONSTANTS
    Throttle = 1
    Expiry = 2
    MaxReports = 3
    Buffer = 1
    Ordered = TRUE
    Expires = TRUE
    KeyedWatch = TRUE
    SelfFilter = TRUE
INVARIANTS NeverOvertaken
CHECK_DEADLOCK FALSE
